<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ghost Battle · You vs Ideal</title>
<style>
  :root{--bg:#06080c;--cyan:#00e5ff;--gold:#ffd23f;--white:#eaf2fa;--dim:#7d8a9a;--grid:#161d27;--red:#ff3b3b;--green:#21e065}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--white);overflow:hidden;
    font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace}
  #stage{position:fixed;inset:0}
  #scene{width:100%;height:100%;display:block}
  .ov{position:absolute;pointer-events:none}
  #hdr{top:30px;left:40px}
  #hdr .t{font-size:26px;font-weight:800;letter-spacing:1px}
  #hdr .s{color:var(--cyan);font-size:13px;margin-top:5px;letter-spacing:2px}
  #gapwrap{top:34px;left:50%;transform:translateX(-50%);text-align:center;width:520px}
  #gapbar{height:16px;background:#10161e;border:1px solid var(--grid);border-radius:9px;position:relative;overflow:hidden;margin-top:8px}
  #gapfill{position:absolute;top:0;bottom:0;left:50%;background:var(--green)}
  #gaptxt{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:8px}
  #gaplabel{font-size:11px;color:var(--dim);letter-spacing:2px}
  .legend{top:30px;right:40px;text-align:right}
  .legend div{font-size:14px;font-weight:800;margin:4px 0}
  #controls{left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:14px;pointer-events:auto;align-items:center}
  button{background:#11161d;color:var(--white);border:1px solid var(--grid);border-radius:8px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}
  button:hover{border-color:var(--cyan)}
  #sponsors{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:20px;opacity:.4;filter:saturate(.2)}
  #sponsors .sp{font-weight:800;font-size:11px;letter-spacing:2px;color:#9fb0c0;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div class="ov" id="hdr"><div class="t">GHOST BATTLE</div><div class="s" id="sub">YOU vs THE IDEAL LAP</div></div>
  <div class="ov legend">
    <div style="color:var(--cyan)">● YOU · <span id="ybest">–</span></div>
    <div style="color:var(--gold)">● IDEAL · <span id="ibest">–</span></div>
  </div>
  <div class="ov" id="gapwrap">
    <div id="gaplabel">GAP TO IDEAL</div>
    <div id="gapbar"><div id="gapfill"></div></div>
    <div id="gaptxt">+0.00</div>
  </div>
  <div class="ov" id="controls"><button id="play">▶ RACE</button><button id="reset">↻</button></div>
  <div class="ov" id="sponsors">
    <span class="sp" style="color:#eaf2fa"> Apple</span><span class="sp" style="color:#ff8000">McLaren</span>
    <span class="sp" style="color:#d9a441">✳ Claude</span><span class="sp">Sodi</span><span class="sp">Honda</span>
  </div>
</div>
<script>
const C={cyan:"#00e5ff",gold:"#ffd23f",white:"#eaf2fa",dim:"#7d8a9a",grid:"#161d27",red:"#ff3b3b",green:"#21e065"};
const $=id=>document.getElementById(id);
let G,trk,N,W,H,ctx,scene,playing=false,prog=0,raf,vmax=45,startT=0;
function spC(v){const f=Math.max(0,Math.min(1,v/vmax));return `rgb(${Math.round(20+f*235)},${Math.round(120+f*100)},255)`;}
async function boot(){
  G=await(await fetch("ghost.json")).json();
  const rj=await(await fetch("render.json")).json();
  trk=rj.track_polyline; vmax=rj.max_speed_mph;
  N=G.n;
  $("sub").textContent=`${G.session_key} · YOU vs THE IDEAL LAP (best of every sector)`;
  $("ybest").textContent=G.best.lap_time.toFixed(3)+"s";
  $("ibest").textContent=G.ideal.lap_time.toFixed(3)+"s";
  scene=$("scene");ctx=scene.getContext("2d");size();window.onresize=size;
  $("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"❚❚":"▶ RACE";if(playing){startT=performance.now()-prog*G.best.lap_time*1000;tick();}};
  $("reset").onclick=()=>{prog=0;draw();};
  window.__ready=true;
  window.__seekFrame=(t)=>{prog=Math.max(0,Math.min(1,t/G.best.lap_time));draw();};
  draw();
}
function size(){scene.width=innerWidth*devicePixelRatio;scene.height=innerHeight*devicePixelRatio;W=scene.width;H=scene.height;}
function map(x,y){const m=0.12*Math.min(W,H);return [m+x*(W-2*m),H-(m+y*(H-2*m))];}
function tick(){if(!playing)return;
  const el=(performance.now()-startT)/1000;prog=el/G.best.lap_time;
  if(prog>=1){prog=1;playing=false;$("play").textContent="▶ RACE";}
  draw();if(playing)raf=requestAnimationFrame(tick);}
function lerp(a,b,t){return a+(b-a)*t;}
function sampleAt(arrx,arry,p){const f=p*(N-1),i=Math.floor(f),t=f-i,j=Math.min(N-1,i+1);
  return [lerp(arrx[i],arrx[j],t),lerp(arry[i],arry[j],t)];}
function draw(){
  ctx.fillStyle="#06080c";ctx.fillRect(0,0,W,H);
  // track
  ctx.lineWidth=Math.max(9,W*0.013);ctx.strokeStyle="#10161e";ctx.lineJoin="round";ctx.lineCap="round";
  ctx.beginPath();trk.forEach((p,k)=>{const[a,b]=map(p[0],p[1]);k?ctx.lineTo(a,b):ctx.moveTo(a,b);});ctx.stroke();
  // YOU position by progress (time-parametrized): find frac where best.t == prog*lap_time
  const yT=prog*G.best.lap_time;
  // ideal time at same WALL-CLOCK -> how far along ideal is at this real time
  // race by elapsed time: both started together; position = where each lap's t<=elapsed
  const elapsed=yT;
  const yp=fracAtTime(G.best.t,elapsed);
  const ip=fracAtTime(G.ideal.t,elapsed);
  // trails
  drawTrail(G.best.x,G.best.y,yp,C.cyan);
  drawTrail(G.ideal.x,G.ideal.y,ip,C.gold);
  // dots
  dot(G.best.x,G.best.y,yp,C.cyan);
  dot(G.ideal.x,G.ideal.y,ip,C.gold);
  // gap: distance(progress) difference -> time gap = how far ideal is ahead in frac, mapped to time
  const gap=timeGap(elapsed);
  const gt=$("gaptxt");gt.textContent=(gap>=0?"+":"")+gap.toFixed(2);
  gt.style.color=gap>0.001?C.red:(gap<-0.001?C.green:C.white);
  const f=$("gapfill");const mag=Math.min(1,Math.abs(gap)/2);
  f.style.width=(mag*50)+"%";f.style.left=gap>0?"50%":(50-mag*50)+"%";
  f.style.background=gap>0?C.red:C.green;
}
function fracAtTime(tarr,el){if(el<=0)return 0;if(el>=tarr[N-1])return 1;
  let lo=0,hi=N-1;while(lo<hi){const m=(lo+hi)>>1;if(tarr[m]<el)lo=m+1;else hi=m;}return lo/(N-1);}
function timeGap(el){ // how much later YOU reach the point IDEAL is at now (positive = you behind)
  const ip=fracAtTime(G.ideal.t,el); // ideal progress fraction
  // time YOU take to reach same fraction:
  const yTimeAtFrac=G.best.t[Math.round(ip*(N-1))];
  return el - G.ideal.t[Math.round(ip*(N-1))] + (yTimeAtFrac - el);
}
function drawTrail(xa,ya,p,col){const upto=Math.round(p*(N-1));ctx.lineWidth=Math.max(4,W*0.006);ctx.strokeStyle=col;ctx.globalAlpha=.5;
  ctx.beginPath();for(let k=0;k<=upto;k++){const[a,b]=map(xa[k],ya[k]);k?ctx.lineTo(a,b):ctx.moveTo(a,b);}ctx.stroke();ctx.globalAlpha=1;}
function dot(xa,ya,p,col){const[x,y]=sampleAt(xa,ya,p);const[a,b]=map(x,y);
  const g=ctx.createRadialGradient(a,b,0,a,b,W*0.03);g.addColorStop(0,col+"99");g.addColorStop(1,col+"00");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(a,b,W*0.03,0,7);ctx.fill();
  ctx.fillStyle=C.white;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(a,b,Math.max(6,W*0.011),0,7);ctx.fill();ctx.stroke();}
boot();
</script>
</body>
</html>
